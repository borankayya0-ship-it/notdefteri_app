name: Build NotePad APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Android Project and Wrapper
      run: |
        # 1. ÇÖZÜM: Önce boş bir settings.gradle oluşturarak Gradle'ı kandırıyoruz
        touch settings.gradle
        
        # 2. Şimdi hata vermeden 8.0 sürümünü kuracak
        gradle wrapper --gradle-version 8.0

        # 3. Gerekli klasörleri oluşturuyoruz
        mkdir -p app/src/main/java/com/example/notepad
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 4. Gerçek settings.gradle içeriğini yazıyoruz (Boş dosyanın üzerine yazılır)
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SimpleNotepad"
        include ':app'
        EOF

        # root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        # app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.notepad'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.notepad"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_menu_edit"
                android:label="Not Defteri"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Layout XML
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp">

            <EditText
                android:id="@+id/etNote"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"
                android:gravity="top|start"
                android:hint="Notlarınızı buraya yazın..."
                android:inputType="textMultiLine"
                android:background="@android:color/transparent" />

            <Button
                android:id="@+id/btnSave"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Kaydet" />
        </LinearLayout>
        EOF

        # MainActivity.java
        cat << 'EOF' > app/src/main/java/com/example/notepad/MainActivity.java
        package com.example.notepad;

        import android.content.Context;
        import android.os.Bundle;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;
        import java.io.FileInputStream;
        import java.io.FileOutputStream;

        public class MainActivity extends AppCompatActivity {
            private static final String FILE_NAME = "my_note.txt";
            private EditText etNote;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                etNote = findViewById(R.id.etNote);
                Button btnSave = findViewById(R.id.btnSave);

                loadNote();

                btnSave.setOnClickListener(v -> saveNote());
            }

            private void saveNote() {
                String text = etNote.getText().toString();
                try (FileOutputStream fos = openFileOutput(FILE_NAME, Context.MODE_PRIVATE)) {
                    fos.write(text.getBytes());
                    Toast.makeText(this, "Not kaydedildi!", Toast.LENGTH_SHORT).show();
                } catch (Exception e) {
                    Toast.makeText(this, "Hata oluştu!", Toast.LENGTH_SHORT).show();
                }
            }

            private void loadNote() {
                try (FileInputStream fis = openFileInput(FILE_NAME)) {
                    byte[] bytes = new byte[fis.available()];
                    fis.read(bytes);
                    etNote.setText(new String(bytes));
                } catch (Exception ignored) {
                }
            }
        }
        EOF

    # Grant execute permission for gradlew
    - name: Make gradlew executable
      run: chmod +x gradlew

    # Build APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Upload APK Artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NotDefteri-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
