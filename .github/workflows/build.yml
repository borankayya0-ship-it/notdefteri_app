name: Build Autonomous AI Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate AI Agent Project
      run: |
        touch settings.gradle
        gradle wrapper --gradle-version 8.0

        mkdir -p app/src/main/java/com/agent/auto
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AutoAgent"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.agent.auto'
            compileSdk 33

            defaultConfig {
                applicationId "com.agent.auto"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            // HTTP istekleri ve JSON işlemleri için profesyonel kütüphaneler
            implementation 'com.squareup.okhttp3:okhttp:4.11.0'
            implementation 'org.json:json:20210307'
        }
        EOF

        # Uygulama İzinleri ve Servis Tanımı
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_menu_manage"
                android:label="Auto AI Agent"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <!-- Yapay Zeka için Erişilebilirlik Servisi -->
                <service
                    android:name=".AgentAccessibilityService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        # Erişilebilirlik Servisi Konfigürasyonu
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
            android:canRetrieveWindowContent="true"
            android:canPerformGestures="true"
            android:description="Yapay Zeka Otonom Ajan Servisi. Ekranı okur ve otonom işlemler yapar." />
        EOF

        # Layout XML (Profesyonel Arayüz)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:padding="16dp">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="AI Agent Kurulumu"
                    android:textSize="24sp"
                    android:textStyle="bold"
                    android:layout_marginBottom="16dp"/>

                <EditText
                    android:id="@+id/etApiUrl"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="API URL (Örn: https://api.openai.com/v1/chat/completions)"
                    android:inputType="textUri" />

                <EditText
                    android:id="@+id/etApiKey"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="API Key (Bearer Token)"
                    android:inputType="textPassword" />

                <EditText
                    android:id="@+id/etModelName"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="Model Adı (Örn: gpt-4o, qwen-2.5)"
                    android:inputType="text" />

                <Button
                    android:id="@+id/btnSaveConfig"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="Ayarları Kaydet" />

                <View
                    android:layout_width="match_parent"
                    android:layout_height="1dp"
                    android:background="#CCCCCC"
                    android:layout_marginVertical="16dp"/>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Görev Ver"
                    android:textSize="18sp"
                    android:textStyle="bold"/>

                <EditText
                    android:id="@+id/etTask"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="Örn: Zarchiver'ı aç, download'a gir..."
                    android:inputType="textMultiLine"
                    android:minLines="3"
                    android:gravity="top"/>

                <Button
                    android:id="@+id/btnStartAgent"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="Ajanı Başlat ve İzinleri Ver"
                    android:backgroundTint="#4CAF50"/>

            </LinearLayout>
        </ScrollView>
        EOF

        # MainActivity.java
        cat << 'EOF' > app/src/main/java/com/agent/auto/MainActivity.java
        package com.agent.auto;

        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.os.Bundle;
        import android.provider.Settings;
        import android.text.TextUtils;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {

            private EditText etApiUrl, etApiKey, etModelName, etTask;
            private SharedPreferences prefs;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE);

                etApiUrl = findViewById(R.id.etApiUrl);
                etApiKey = findViewById(R.id.etApiKey);
                etModelName = findViewById(R.id.etModelName);
                etTask = findViewById(R.id.etTask);

                // Kayıtlı ayarları yükle
                etApiUrl.setText(prefs.getString("api_url", ""));
                etApiKey.setText(prefs.getString("api_key", ""));
                etModelName.setText(prefs.getString("model_name", ""));
                etTask.setText(prefs.getString("current_task", ""));

                findViewById(R.id.btnSaveConfig).setOnClickListener(v -> {
                    prefs.edit()
                        .putString("api_url", etApiUrl.getText().toString())
                        .putString("api_key", etApiKey.getText().toString())
                        .putString("model_name", etModelName.getText().toString())
                        .apply();
                    Toast.makeText(this, "Ayarlar Kaydedildi!", Toast.LENGTH_SHORT).show();
                });

                findViewById(R.id.btnStartAgent).setOnClickListener(v -> {
                    String task = etTask.getText().toString();
                    if(TextUtils.isEmpty(task)){
                        Toast.makeText(this, "Lütfen bir görev girin!", Toast.LENGTH_SHORT).show();
                        return;
                    }
                    prefs.edit().putString("current_task", task).putBoolean("is_running", true).apply();
                    
                    // Erişilebilirlik izni kontrolü ve yönlendirme
                    Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                    startActivity(intent);
                    Toast.makeText(this, "Lütfen listeden 'Auto AI Agent' servisini aktif edin.", Toast.LENGTH_LONG).show();
                });
            }
        }
        EOF

        # AgentAccessibilityService.java (Ajanın Beyni - Ekranı Okuyan ve Tıklayan Yer)
        cat << 'EOF' > app/src/main/java/com/agent/auto/AgentAccessibilityService.java
        package com.agent.auto;

        import android.accessibilityservice.AccessibilityService;
        import android.content.Context;
        import android.content.SharedPreferences;
        import android.os.Handler;
        import android.os.Looper;
        import android.util.Log;
        import android.view.accessibility.AccessibilityEvent;
        import android.view.accessibility.AccessibilityNodeInfo;
        import android.widget.Toast;

        import org.json.JSONArray;
        import org.json.JSONObject;

        import java.io.IOException;
        import java.util.concurrent.TimeUnit;

        import okhttp3.Call;
        import okhttp3.Callback;
        import okhttp3.MediaType;
        import okhttp3.OkHttpClient;
        import okhttp3.Request;
        import okhttp3.RequestBody;
        import okhttp3.Response;

        public class AgentAccessibilityService extends AccessibilityService {

            private static final String TAG = "AutoAgent";
            private OkHttpClient client;
            private boolean isProcessing = false;
            private SharedPreferences prefs;

            @Override
            protected void onServiceConnected() {
                super.onServiceConnected();
                client = new OkHttpClient.Builder()
                        .connectTimeout(30, TimeUnit.SECONDS)
                        .readTimeout(30, TimeUnit.SECONDS)
                        .build();
                prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE);
                Toast.makeText(this, "Ajan Servisi Bağlandı!", Toast.LENGTH_SHORT).show();
            }

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
                if (event.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                    event.getEventType() != AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED) {
                    return;
                }

                if (!prefs.getBoolean("is_running", false)) return;
                if (isProcessing) return;

                AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                if (rootNode == null) return;

                isProcessing = true;
                
                // 1. Ekranı Yapay Zeka için Metne Çevir (Node Parsing)
                StringBuilder screenState = new StringBuilder();
                parseScreen(rootNode, screenState);
                
                String task = prefs.getString("current_task", "");
                String apiUrl = prefs.getString("api_url", "");
                String apiKey = prefs.getString("api_key", "");
                String model = prefs.getString("model_name", "");

                Log.d(TAG, "Görev: " + task);
                Log.d(TAG, "Ekran Durumu: " + screenState.toString());

                // 2. Yapay Zekaya Gönder ve Karar Al
                askAIToDecide(apiUrl, apiKey, model, task, screenState.toString(), rootNode);
            }

            private void parseScreen(AccessibilityNodeInfo node, StringBuilder sb) {
                if (node == null) return;
                if (node.getText() != null) sb.append("Text: '").append(node.getText()).append("', ");
                if (node.getContentDescription() != null) sb.append("Desc: '").append(node.getContentDescription()).append("', ");
                
                for (int i = 0; i < node.getChildCount(); i++) {
                    parseScreen(node.getChild(i), sb);
                }
            }

            private void askAIToDecide(String url, String key, String model, String task, String screenContext, AccessibilityNodeInfo rootNode) {
                try {
                    // Yapay zekaya verilecek Prompt sistemi
                    JSONObject systemMessage = new JSONObject();
                    systemMessage.put("role", "system");
                    systemMessage.put("content", "Sen otonom bir Android ajanısın. Görevin: " + task + ". Sana ekrandaki metinleri gönderiyorum: " + screenContext + ". Cevabını sadece tıklamam gereken metni veya açıklamayı (Text veya Desc) yazarak ver. Başka hiçbir şey yazma.");

                    JSONArray messages = new JSONArray();
                    messages.put(systemMessage);

                    JSONObject jsonBody = new JSONObject();
                    jsonBody.put("model", model);
                    jsonBody.put("messages", messages);

                    RequestBody body = RequestBody.create(jsonBody.toString(), MediaType.parse("application/json; charset=utf-8"));
                    Request request = new Request.Builder()
                            .url(url)
                            .addHeader("Authorization", "Bearer " + key)
                            .post(body)
                            .build();

                    client.newCall(request).enqueue(new Callback() {
                        @Override
                        public void onFailure(Call call, IOException e) {
                            isProcessing = false;
                            Log.e(TAG, "API Hatası: " + e.getMessage());
                        }

                        @Override
                        public void onResponse(Call call, Response response) throws IOException {
                            if(response.isSuccessful() && response.body() != null) {
                                try {
                                    String respStr = response.body().string();
                                    JSONObject jsonObject = new JSONObject(respStr);
                                    String aiTargetText = jsonObject.getJSONArray("choices")
                                            .getJSONObject(0).getJSONObject("message").getString("content").trim();
                                    
                                    Log.d(TAG, "Yapay Zeka Kararı (Tıklanacak): " + aiTargetText);
                                    
                                    // 3. Kararı Uygula (Otonom Tıklama)
                                    performClickOnText(rootNode, aiTargetText);
                                    
                                } catch (Exception e) {
                                    e.printStackTrace();
                                }
                            }
                            // İşlem bittikten sonra 3 saniye bekle ve döngüye devam et
                            new Handler(Looper.getMainLooper()).postDelayed(() -> isProcessing = false, 3000);
                        }
                    });
                } catch (Exception e) {
                    isProcessing = false;
                }
            }

            private boolean performClickOnText(AccessibilityNodeInfo node, String targetText) {
                if (node == null) return false;
                
                String text = node.getText() != null ? node.getText().toString() : "";
                String desc = node.getContentDescription() != null ? node.getContentDescription().toString() : "";

                if (text.toLowerCase().contains(targetText.toLowerCase()) || desc.toLowerCase().contains(targetText.toLowerCase())) {
                    if (node.isClickable()) {
                        node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                        return true;
                    } else if (node.getParent() != null && node.getParent().isClickable()) {
                        node.getParent().performAction(AccessibilityNodeInfo.ACTION_CLICK);
                        return true;
                    }
                }

                for (int i = 0; i < node.getChildCount(); i++) {
                    if (performClickOnText(node.getChild(i), targetText)) return true;
                }
                return false;
            }

            @Override
            public void onInterrupt() {
                isProcessing = false;
            }
        }
        EOF

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoAgent-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
