name: Build Autonomous AI Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate AI Agent Project
      run: |
        touch settings.gradle
        gradle wrapper --gradle-version 8.0

        mkdir -p app/src/main/java/com/agent/auto
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AutoAgent"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.agent.auto'
            compileSdk 33

            defaultConfig {
                applicationId "com.agent.auto"
                minSdk 24
                targetSdk 33
                versionCode 3
                versionName "3.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'com.squareup.okhttp3:okhttp:4.11.0'
            implementation 'org.json:json:20210307'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_menu_manage"
                android:label="Auto AI Agent"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <!-- Yapay Zeka Erişilebilirlik Servisi -->
                <service
                    android:name=".AgentAccessibilityService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Auto AI Agent</string>
            <string name="accessibility_service_description">Yapay Zeka Otonom Ajan Servisi. Ekranı okur, düğmelere basar ve komutları çalıştırır.</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
            android:canRetrieveWindowContent="true"
            android:canPerformGestures="true"
            android:description="@string/accessibility_service_description" />
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:padding="16dp">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Otonom AI Ajan Kontrol Paneli"
                    android:textSize="20sp"
                    android:textStyle="bold"
                    android:layout_marginBottom="12dp"/>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="1. API Konfigürasyonu"
                    android:textStyle="bold"
                    android:textColor="#333333"/>

                <EditText
                    android:id="@+id/etApiUrl"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="API URL (Örn: https://api.openai.com/v1/chat/completions)"
                    android:inputType="textUri"
                    android:textSize="14sp"/>

                <EditText
                    android:id="@+id/etApiKey"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="API Key (Bearer Token)"
                    android:inputType="textPassword"
                    android:textSize="14sp"/>

                <EditText
                    android:id="@+id/etModelName"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="Model Adı (Örn: gpt-4o, qwen-2.5)"
                    android:inputType="text"
                    android:textSize="14sp"/>

                <Button
                    android:id="@+id/btnSaveConfig"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="API Ayarlarını Kaydet" />

                <View
                    android:layout_width="match_parent"
                    android:layout_height="1dp"
                    android:background="#DDDDDD"
                    android:layout_marginVertical="12dp"/>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="2. Gerekli İzinler"
                    android:textStyle="bold"
                    android:textColor="#333333"/>

                <Button
                    android:id="@+id/btnGrantAccessibility"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="Erişilebilirlik İznini Aç"
                    android:backgroundTint="#FF9800"/>

                <Button
                    android:id="@+id/btnGrantOverlay"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="Üstte Gösterim İznini Aç"
                    android:backgroundTint="#009688"
                    android:layout_marginTop="4dp"/>

                <View
                    android:layout_width="match_parent"
                    android:layout_height="1dp"
                    android:background="#DDDDDD"
                    android:layout_marginVertical="12dp"/>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="3. Görev Emri"
                    android:textStyle="bold"
                    android:textColor="#333333"/>

                <EditText
                    android:id="@+id/etTask"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="Örn: Zarchiver'ı aç ve Download'a gir..."
                    android:inputType="textMultiLine"
                    android:minLines="3"
                    android:gravity="top"
                    android:layout_marginTop="6dp"/>

                <Button
                    android:id="@+id/btnStartAgent"
                    android:layout_width="match_parent"
                    android:layout_height="60dp"
                    android:text="🚀 OTONOM AJANI BAŞLAT"
                    android:textSize="16sp"
                    android:textStyle="bold"
                    android:backgroundTint="#4CAF50"
                    android:layout_marginTop="8dp"/>

                <Button
                    android:id="@+id/btnStopAgent"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="🛑 AJANI DURDUR"
                    android:backgroundTint="#F44336"
                    android:layout_marginTop="4dp"/>

            </LinearLayout>
        </ScrollView>
        EOF

        cat << 'EOF' > app/src/main/java/com/agent/auto/MainActivity.java
        package com.agent.auto;

        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.provider.Settings;
        import android.text.TextUtils;
        import android.widget.EditText;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {

            private EditText etApiUrl, etApiKey, etModelName, etTask;
            private SharedPreferences prefs;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE);

                etApiUrl = findViewById(R.id.etApiUrl);
                etApiKey = findViewById(R.id.etApiKey);
                etModelName = findViewById(R.id.etModelName);
                etTask = findViewById(R.id.etTask);

                etApiUrl.setText(prefs.getString("api_url", ""));
                etApiKey.setText(prefs.getString("api_key", ""));
                etModelName.setText(prefs.getString("model_name", ""));
                etTask.setText(prefs.getString("current_task", ""));

                findViewById(R.id.btnSaveConfig).setOnClickListener(v -> {
                    prefs.edit()
                        .putString("api_url", etApiUrl.getText().toString().trim())
                        .putString("api_key", etApiKey.getText().toString().trim())
                        .putString("model_name", etModelName.getText().toString().trim())
                        .apply();
                    Toast.makeText(this, "API Ayarları Kaydedildi!", Toast.LENGTH_SHORT).show();
                });

                findViewById(R.id.btnGrantAccessibility).setOnClickListener(v -> {
                    Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                    startActivity(intent);
                    Toast.makeText(this, "Listeden 'Auto AI Agent' servisini bulup aktif edin.", Toast.LENGTH_LONG).show();
                });

                findViewById(R.id.btnGrantOverlay).setOnClickListener(v -> {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                        Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                Uri.parse("package:" + getPackageName()));
                        startActivity(intent);
                    }
                });

                findViewById(R.id.btnStartAgent).setOnClickListener(v -> {
                    String task = etTask.getText().toString().trim();
                    if (TextUtils.isEmpty(task)) {
                        Toast.makeText(this, "Lütfen ajana bir görev yazın!", Toast.LENGTH_LONG).show();
                        return;
                    }

                    prefs.edit()
                        .putString("current_task", task)
                        .putBoolean("is_running", true)
                        .apply();

                    Toast.makeText(this, "🚀 Otonom Ajan Başlatıldı! Ana ekrana dönebilirsiniz.", Toast.LENGTH_LONG).show();
                });

                findViewById(R.id.btnStopAgent).setOnClickListener(v -> {
                    prefs.edit().putBoolean("is_running", false).apply();
                    Toast.makeText(this, "🛑 Otonom Ajan Durduruldu.", Toast.LENGTH_SHORT).show();
                });
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/agent/auto/AgentAccessibilityService.java
        package com.agent.auto;

        import android.accessibilityservice.AccessibilityService;
        import android.content.Context;
        import android.content.SharedPreferences;
        import android.os.Handler;
        import android.os.Looper;
        import android.util.Log;
        import android.view.accessibility.AccessibilityEvent;
        import android.view.accessibility.AccessibilityNodeInfo;
        import android.widget.Toast;

        import org.json.JSONArray;
        import org.json.JSONObject;

        import java.io.IOException;
        import java.util.concurrent.TimeUnit;

        import okhttp3.Call;
        import okhttp3.Callback;
        import okhttp3.MediaType;
        import okhttp3.OkHttpClient;
        import okhttp3.Request;
        import okhttp3.RequestBody;
        import okhttp3.Response;

        public class AgentAccessibilityService extends AccessibilityService {

            private static final String TAG = "AutoAgentService";
            private OkHttpClient client;
            private boolean isProcessing = false;
            private SharedPreferences prefs;

            @Override
            protected void onServiceConnected() {
                super.onServiceConnected();
                client = new OkHttpClient.Builder()
                        .connectTimeout(30, TimeUnit.SECONDS)
                        .readTimeout(30, TimeUnit.SECONDS)
                        .build();
                prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE);
                
                new Handler(Looper.getMainLooper()).post(() -> 
                    Toast.makeText(this, "✅ AI Agent Erişilebilirlik Servisi Aktif!", Toast.LENGTH_SHORT).show()
                );
            }

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
                if (!prefs.getBoolean("is_running", false)) return;

                int eventType = event.getEventType();
                if (eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                    eventType != AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED) {
                    return;
                }

                if (isProcessing) return;

                AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                if (rootNode == null) return;

                isProcessing = true;

                StringBuilder screenTextBuilder = new StringBuilder();
                parseScreenTree(rootNode, screenTextBuilder);

                String task = prefs.getString("current_task", "");
                String apiUrl = prefs.getString("api_url", "");
                String apiKey = prefs.getString("api_key", "");
                String model = prefs.getString("model_name", "gpt-4o");

                if (screenTextBuilder.length() > 0 && !apiUrl.isEmpty()) {
                    sendToAI(apiUrl, apiKey, model, task, screenTextBuilder.toString(), rootNode);
                } else {
                    isProcessing = false;
                }
            }

            private void parseScreenTree(AccessibilityNodeInfo node, StringBuilder sb) {
                if (node == null) return;
                
                CharSequence text = node.getText();
                CharSequence desc = node.getContentDescription();

                if (text != null && text.length() > 0) {
                    sb.append("[").append(text.toString().trim()).append("] ");
                } else if (desc != null && desc.length() > 0) {
                    sb.append("[").append(desc.toString().trim()).append("] ");
                }

                for (int i = 0; i < node.getChildCount(); i++) {
                    parseScreenTree(node.getChild(i), sb);
                }
            }

            private void sendToAI(String url, String key, String model, String task, String screenContent, AccessibilityNodeInfo rootNode) {
                try {
                    JSONObject systemMessage = new JSONObject();
                    systemMessage.put("role", "system");
                    systemMessage.put("content", "Sen bir Android Otonom Ajanısın. Ana Görev: " + task + 
                            ". Ekrandaki görünür elemanlar: " + screenContent + 
                            ". Şimdi neye tıklamam gerektiğini SADECE ekranda tırnak içinde geçen metin olarak yaz. Ekstra hiçbir açıklama yapma.");

                    JSONArray messages = new JSONArray();
                    messages.put(systemMessage);

                    JSONObject jsonBody = new JSONObject();
                    jsonBody.put("model", model.isEmpty() ? "gpt-4o" : model);
                    jsonBody.put("messages", messages);

                    RequestBody body = RequestBody.create(jsonBody.toString(), MediaType.parse("application/json; charset=utf-8"));
                    
                    Request.Builder reqBuilder = new Request.Builder().url(url).post(body);
                    if (!key.isEmpty()) {
                        reqBuilder.addHeader("Authorization", "Bearer " + key);
                    }

                    client.newCall(reqBuilder.build()).enqueue(new Callback() {
                        @Override
                        public void onFailure(Call call, IOException e) {
                            resetProcessingDelay(4000);
                        }

                        @Override
                        public void onResponse(Call call, Response response) throws IOException {
                            if (response.isSucc
